    uid: '\Google\Cloud\Vision\V1\Gapic\ImageAnnotatorGapicClient::batchAnnotateFiles()'
    name: batchAnnotateFiles
    id: batchAnnotateFiles
    summary: |
      Service that performs image detection and annotation for a batch of files.
      
      Now only "application/pdf", "image/tiff" and "image/gif" are supported.
      
      This service will extract at most 5 (customers can specify which 5 in
      AnnotateFileRequest.pages) frames (gif) or pages (pdf or tiff) from each
      file provided and perform detection and annotation for each image
      extracted.
      
      Sample code:
      ```
      $imageAnnotatorClient = new ImageAnnotatorClient();
      try {
          $requests = [];
          $response = $imageAnnotatorClient->batchAnnotateFiles($requests);
      } finally {
          $imageAnnotatorClient->close();
      }
      ```
    parent: \Google\Cloud\Vision\V1\Gapic\ImageAnnotatorGapicClient
    type: method
    langs:
      - php
    parameters:
      - { name: requests, type: '\Google\Cloud\Vision\V1\AnnotateFileRequest[]', description: 'Required. The list of file annotation requests. Right now we support only one AnnotateFileRequest in BatchAnnotateFilesRequest.' }
      - { name: optionalArgs, type: array, description: Optional. }
      - { name: '↳ parent', type: string, description: 'Optional. Target project and location to make a call. Format: `projects/{project-id}/locations/{location-id}`. If no parent is specified, a region will be chosen automatically. Supported location-ids: `us`: USA country only, `asia`: East asia areas, like Japan, Taiwan, `eu`: The European Union. Example: `projects/project-A/locations/eu`.' }
      - { name: '↳ retrySettings', type: RetrySettings|array, description: 'Retry settings to use for this call. Can be a {@see} object, or an associative array of retry settings parameters. See the documentation on {@see} for example usage.' }
