  -
    uid: '\Google\Cloud\Vision\V1\FaceAnnotation::__construct()'
    name: __construct
    id: __construct
    summary: Constructor.
    parent: \Google\Cloud\Vision\V1\FaceAnnotation
    type: method
    langs:
      - php
    parameters:
      - { name: data, type: array, description: 'Optional. Data for populating the Message object.' }
      - { name: '↳ bounding_poly', type: \Google\Cloud\Vision\V1\BoundingPoly, description: 'The bounding polygon around the face. The coordinates of the bounding box are in the original image''s scale. The bounding box is computed to "frame" the face in accordance with human expectations. It is based on the landmarker results. Note that one or more x and/or y coordinates may not be generated in the `BoundingPoly` (the polygon will be unbounded) if only a partial face appears in the image to be annotated.' }
      - { name: '↳ fd_bounding_poly', type: \Google\Cloud\Vision\V1\BoundingPoly, description: 'The `fd_bounding_poly` bounding polygon is tighter than the `boundingPoly`, and encloses only the skin part of the face. Typically, it is used to eliminate the face from any image analysis that detects the "amount of skin" visible in an image. It is not based on the landmarker results, only on the initial face detection, hence the <code>fd</code> (face detection) prefix.' }
      - { name: '↳ landmarks', type: '\Google\Cloud\Vision\V1\FaceAnnotation\Landmark[]|\Google\Protobuf\Internal\RepeatedField', description: 'Detected face landmarks.' }
      - { name: '↳ roll_angle', type: float, description: 'Roll angle, which indicates the amount of clockwise/anti-clockwise rotation of the face relative to the image vertical about the axis perpendicular to the face. Range [-180,180].' }
      - { name: '↳ pan_angle', type: float, description: 'Yaw angle, which indicates the leftward/rightward angle that the face is pointing relative to the vertical plane perpendicular to the image. Range [-180,180].' }
      - { name: '↳ tilt_angle', type: float, description: 'Pitch angle, which indicates the upwards/downwards angle that the face is pointing relative to the image''s horizontal plane. Range [-180,180].' }
      - { name: '↳ detection_confidence', type: float, description: 'Detection confidence. Range [0, 1].' }
      - { name: '↳ landmarking_confidence', type: float, description: 'Face landmarking confidence. Range [0, 1].' }
      - { name: '↳ joy_likelihood', type: int, description: 'Joy likelihood.' }
      - { name: '↳ sorrow_likelihood', type: int, description: 'Sorrow likelihood.' }
      - { name: '↳ anger_likelihood', type: int, description: 'Anger likelihood.' }
      - { name: '↳ surprise_likelihood', type: int, description: 'Surprise likelihood.' }
      - { name: '↳ under_exposed_likelihood', type: int, description: 'Under-exposed likelihood.' }
      - { name: '↳ blurred_likelihood', type: int, description: 'Blurred likelihood.' }
      - { name: '↳ headwear_likelihood', type: int, description: 'Headwear likelihood.' }
  -
    uid: '\Google\Cloud\Vision\V1\FaceAnnotation::getBoundingPoly()'
    name: getBoundingPoly
    id: getBoundingPoly
    summary: |
      The bounding polygon around the face. The coordinates of the bounding box
      are in the original image's scale.
      
      The bounding box is computed to "frame" the face in accordance with human
      expectations. It is based on the landmarker results.
      Note that one or more x and/or y coordinates may not be generated in the
      `BoundingPoly` (the polygon will be unbounded) if only a partial face
      appears in the image to be annotated.
      
      Generated from protobuf field <code>.google.cloud.vision.v1.BoundingPoly bounding_poly = 1;</code>
    parent: \Google\Cloud\Vision\V1\FaceAnnotation
    type: method
    langs:
      - php
