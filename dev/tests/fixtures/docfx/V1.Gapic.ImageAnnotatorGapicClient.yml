    parameters:
      - { name: requests, type: '\Google\Cloud\Vision\V1\AnnotateImageRequest[]', description: 'Required. Individual image annotation requests for this batch.' }
      - { name: outputConfig, type: \Google\Cloud\Vision\V1\OutputConfig, description: 'Required. The desired output location and metadata (e.g. format).' }
