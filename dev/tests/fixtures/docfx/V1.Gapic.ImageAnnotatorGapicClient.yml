    uid: '\Google\Cloud\Vision\V1\Gapic\ImageAnnotatorGapicClient::asyncBatchAnnotateFiles()'
    name: asyncBatchAnnotateFiles
    id: asyncBatchAnnotateFiles
    summary: |
      Run asynchronous image detection and annotation for a list of generic
      files, such as PDF files, which may contain multiple pages and multiple
      images per page. Progress and results can be retrieved through the
      `google.longrunning.Operations` interface.
      
      `Operation.metadata` contains `OperationMetadata` (metadata).
      `Operation.response` contains `AsyncBatchAnnotateFilesResponse` (results).
      
      Sample code:
      ```
      $imageAnnotatorClient = new ImageAnnotatorClient();
      try {
          $requests = [];
          $operationResponse = $imageAnnotatorClient->asyncBatchAnnotateFiles($requests);
          $operationResponse->pollUntilComplete();
          if ($operationResponse->operationSucceeded()) {
              $result = $operationResponse->getResult();
          // doSomethingWith($result)
          } else {
              $error = $operationResponse->getError();
              // handleError($error)
          }
          // Alternatively:
          // start the operation, keep the operation name, and resume later
          $operationResponse = $imageAnnotatorClient->asyncBatchAnnotateFiles($requests);
          $operationName = $operationResponse->getName();
          // ... do other work
          $newOperationResponse = $imageAnnotatorClient->resumeOperation($operationName, 'asyncBatchAnnotateFiles');
          while (!$newOperationResponse->isDone()) {
              // ... do other work
              $newOperationResponse->reload();
          }
          if ($newOperationResponse->operationSucceeded()) {
              $result = $newOperationResponse->getResult();
          // doSomethingWith($result)
          } else {
              $error = $newOperationResponse->getError();
              // handleError($error)
          }
      } finally {
          $imageAnnotatorClient->close();
      }
      ```
    parent: \Google\Cloud\Vision\V1\Gapic\ImageAnnotatorGapicClient
    type: method
    langs:
      - php
    parameters:
      - { name: requests, type: '\Google\Cloud\Vision\V1\AsyncAnnotateFileRequest[]', description: 'Required. Individual async file annotation requests for this batch.' }
      - { name: optionalArgs, type: array, description: Optional. }
      - { name: '↳ parent', type: string, description: 'Optional. Target project and location to make a call. Format: `projects/{project-id}/locations/{location-id}`. If no parent is specified, a region will be chosen automatically. Supported location-ids: `us`: USA country only, `asia`: East asia areas, like Japan, Taiwan, `eu`: The European Union. Example: `projects/project-A/locations/eu`.' }
      - { name: '↳ retrySettings', type: RetrySettings|array, description: 'Retry settings to use for this call. Can be a {@see} object, or an associative array of retry settings parameters. See the documentation on {@see} for example usage.' }
